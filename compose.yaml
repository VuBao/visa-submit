name: personal-vault

services:
  bitwarden:
    image: ghcr.io/bitwarden/lite:latest
    container_name: personal-vault-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${BW_HTTP_BIND:-127.0.0.1}:${BW_HTTP_PORT:-8080}:8080"
    volumes:
      - ./data/bitwarden:/etc/bitwarden
    security_opt:
      - no-new-privileges:true
    networks:
      - vault

  database:
    image: mariadb:11.4
    container_name: personal-vault-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - vault

networks:
  vault:
    driver: bridge

